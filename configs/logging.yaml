# ============================================================
# Structured Logging Configuration
# ============================================================
version: 1
disable_existing_loggers: false

formatters:
  json:
    (): pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s %(filename)s %(lineno)d"
    datefmt: "%Y-%m-%dT%H:%M:%S"

  console:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d - %(message)s"
    datefmt: "%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: console
    stream: ext://sys.stdout

  file_json:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/app.jsonl
    maxBytes: 52428800  # 50MB
    backupCount: 5
    encoding: utf-8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: json
    filename: logs/errors.jsonl
    maxBytes: 10485760  # 10MB
    backupCount: 3
    encoding: utf-8

loggers:
  # Application loggers
  src:
    level: DEBUG
    handlers: [console, file_json]
    propagate: false

  src.guardrails:
    level: INFO
    handlers: [console, file_json, error_file]
    propagate: false

  src.agents:
    level: DEBUG
    handlers: [console, file_json]
    propagate: false

  src.data_ingestion:
    level: INFO
    handlers: [console, file_json]
    propagate: false

  # Third-party loggers (suppress noise)
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false

  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: false

  uvicorn.access:
    level: WARNING
    handlers: [console]
    propagate: false

  httpx:
    level: WARNING
    handlers: [console]
    propagate: false

  openai:
    level: WARNING
    handlers: [console]
    propagate: false

  qdrant_client:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console, file_json]
